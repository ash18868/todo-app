services:
  backend:
    image: todo-app-backend:latest
    build:
      context: ./todoapp
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}

  frontend:
    image: todo-app-frontend:latest
    build:
      context: ./todoapp/frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4200:80"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8080"
    depends_on:
      - backend
